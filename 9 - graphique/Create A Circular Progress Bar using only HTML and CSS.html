<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Design by foolishdeveloper.com -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pure CSS Percentage Circle Demo</title>

    <style media="screen">
      .circle-wrap {
        display: grid;
        grid-template-columns: repeat(1, 160px);
        grid-gap: 80px;
        margin-top: 100px;
        margin-left: 50px;
        width: 150px;
        height: 150px;
        background: red;
        border-radius: 50%;
      }

      .circle-wrap .circle .mask,
      .circle-wrap .circle .fill-1 {
        width: 150px;
        height: 150px;
        position: absolute;
        border-radius: 50%;
      }

      .circle-wrap .circle .mask {
        clip: rect(0px, 150px, 150px, 75px);
      }
      .mask .fill-1 {
        clip: rect(0px, 75px, 150px, 0px);
        background-color: green;
        border: none;
      }

      .mask.full-1,
      .circle .fill-1 {
        transform: rotate(145.8deg);
      }
    </style>
    
<script>
  function imprimerPage() {
  window.print();
}
</script>
  </head>
  <body>
    <div class="circle-wrap">
      <div class="circle">
        <div class="mask full-1" style="border: none">
          <div class="fill-1"></div>
        </div>
        <div class="mask half" style="border: none">
          <div class="fill-1"></div>
        </div>
      </div>
    </div>
    <button onclick="imprimerPage()">Imprimer</button>

    <table>
      <tr>
        <th>hhh</th>
        <th>dd</th>
        <th>fff</th>
      </tr>
    </table>
  </body>
</html>

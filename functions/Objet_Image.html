<html>

<head>
    <style type="text/css">
        #overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
        }

        #overlay img {
            margin-top: 100px;
        }

        p {
            margin-top: 300px;
            text-align: center;
        }
    </style>
</head>

<body>
    <a href="C:/Users/Bilal/Pictures/Photo/daoudi.jfif" title="Afficher l'image originale"><img src="C:/Users/Bilal/Pictures/Photo/daoudi.jfif" /></a>
    <div id="overlay"></div>
    <script>
        var links = document.getElementsByTagName('a'),
            linksLen = links.length;
        for (var i = 0; i < linksLen; i++) {
            links[i].onclick = function () { // Vous pouvez très bien utiliser le DOM-2
                displayImg(this); // On appelle notre fonction pour afficher les images et 
        
                return false; // Et on bloque la redirection
            };
        }
        function displayImg(link) {
            var img = new Image(),
                overlay = document.getElementById('overlay');
            img.onload = function () {
                overlay.innerHTML = '';
                overlay.appendChild(img);
            };
            img.src = link.href;
            overlay.style.display = 'block';
            overlay.innerHTML = '<span>Chargement en cours...</span>';
        }
        document.getElementById('overlay').onclick = function () {
            this.style.display = 'none';
        };
    </script>
</body>

</html>

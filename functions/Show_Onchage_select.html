<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #bilal{
            font-size: 50px;
            text-align: center;
        }
        /*#hh{
            background-color: rgb(0, 0, 0);
            width: 15px;
            height: 15px;
            border-radius: 50px;
        }*/
    </style>
    <script>
        function affiche() {
            document.getElementById("bilal").textContent = "";
            var j = 1;
            var m = document.getElementById("nombre").value;
            for (let i = 0; i < m; i++) {
                for (let k = 0; k < j; k++) {
                    //document.getElementById("bilal").innerHTML += "<div id='hh'></div>";
                    document.getElementById("bilal").innerHTML += "☻";
                }
                document.getElementById("bilal").innerHTML += "<br>";
                j+=2;
            }
        }
    </script>
</head>

<body>
    <center>
    <input type="text" id="nombre" onkeyup="affiche()">
    <br><br>
    <div id="bilal"></div>
</center>
</body>

</html>

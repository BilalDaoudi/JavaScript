<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP2</title>
</head>
<body>
    <script>
        var nb1=parseFloat(prompt("donner le nombre 1"));
         var nb2=parseFloat(prompt("donner le nombre 2"));
         var op=prompt("donner l'operateur  ")
         if (op=="+"){
             var som =nb1 +nb2;
             document.write(nb1 +" + "+nb2+" = "+ som);
         }
         if (op=="-"){
             var sous =nb1 -nb2;
             document.write(nb1 +" - "+nb2+" = "+ sous);
         }
         if (op=="*"){
             var prod =nb1 *nb2;
             document.write(nb1 +" * "+nb2+" = "+ prod);
         }
         if (op=="/"){
             var div =nb1 /nb2;
             document.write(nb1 +" / "+nb2+" = "+ div);
         }
    </script>
    
</body>
</html>

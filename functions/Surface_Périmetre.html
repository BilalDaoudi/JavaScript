    <script>
        function surCer(r) {


            sr = 3.14 * r * r;
            document.write("la surface est :" + sr);

        }
        function pereCer(r) {

            pr = 3.14 * 2 * r;
            document.write("le péremètre est :" + pr);
        }
        function surRec(la, lo) {é
            per = la * lo;
            document.write("la surface est :" + per);

        }
        function pereRec(la, lo) {
            sur = la * 2 + lo * 2;
            document.write("le péremètre est :" + sur);

        }
        function rayon() {
            ray = parseFloat(prompt("donner le rayon"));
        }
        function lonlar() {
            lar = parseFloat(prompt("donner la largeur"));
            log = parseFloat(prompt("donner la longueur"));

        }

    <a href="#" onclick="rayon(),pereCer(ray)">Calculer le périmètre d'un cercle</a><br>

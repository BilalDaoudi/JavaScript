<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <textarea cols="30" rows="10" onkeypress="max_length(this)"></textarea>
    <script>
        function max_length(textarea){
            const max1 = 10;
            let data = textarea.value;
            let count = data.length; 
            if (count >  max1){
                let text = data.substring(0,9);
               textarea.value = text
            }
        }
    </script>
</body>
</html>

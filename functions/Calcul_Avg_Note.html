<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function SomCoef() {
            let T_Coef = document.getElementsByClassName("coef")
            let somcoef = 0;
            for (i = 0; i < T_Coef.length; i++) {
                somcoef += parseInt(T_Coef[i].textContent);
            }
            document.getElementById("SomCoef").value = somcoef;
        }

        function SomNote() {
            let T_Note = document.getElementsByClassName("note_coef")
            let somNote = 0;
            for (i = 0; i < T_Note.length; i++) {
                somNote += parseFloat(T_Note[i].textContent);
            }
            document.getElementById("SomNote").value = somNote;
        }
        function Moyenne() {
            let somcoef = document.getElementById("SomCoef").value;
            let somnote = document.getElementById("SomNote").value;
            let moy = somnote / somcoef;
            document.getElementById("moy").value = moy;
        }

        function Ajouter() {
            let nom = document.getElementById("NomModule").value;
            let note = document.getElementById("Note").value;
            let coef = document.getElementById("Coef").value;
            let table = document.getElementById("tbl1");
            if (nom != "" && note != "" && coef != "") {
                if (note >= 0 && note <= 20) {
                    if (coef > 0) {
                        let tr = document.createElement("tr");

                        let td1 = document.createElement("td");
                        td1.textContent = nom;

                        let td2 = document.createElement("td");
                        td2.textContent = note;

                        let td3 = document.createElement("td");
                        td3.setAttribute("class", "coef");
                        td3.textContent = coef;

                        let td4 = document.createElement("td");
                        td4.setAttribute("class", "note_coef");
                        td4.textContent = parseInt(coef) * parseFloat(note);

                        let td5 = document.createElement("td");
                        let btn = document.createElement("button");
                        btn.textContent = "Supprimer";
                        btn.addEventListener("click", function () {
                            tr.remove();
                            SomCoef();
                            SomNote();
                            Moyenne();
                        })
                        td5.appendChild(btn);


                        tr.appendChild(td1);
                        tr.appendChild(td2);
                        tr.appendChild(td3);
                        tr.appendChild(td4);
                        tr.appendChild(td5);

                        table.appendChild(tr);
                        SomCoef();
                        SomNote();
                        Moyenne();
                    }
                    else
                        alert("Coefficient est Supérieure ou égale à 1 ");
                }
                else
                    alert("Note module est entre de 0 et 20 ");
            }
            else
                alert("Tous Les Champs obligatoire ");
        }
    </script>
</head>

<body>
    <div class="form">
        <pre>
        Nom Module   : <input type="text" id="NomModule">

        Note Module  : <input type="number" id="Note">

        Coefficient  : <input type="number" id="Coef">

                    <input type="button" value="Ajouter" onclick="Ajouter()">
        </pre>
    </div>

    <div class="affiche">
        <table border="3" width="100%" id="tbl1">
            <tr>
                <th>Nom Module</th>
                <th>Note Module /20</th>
                <th>Coefficient</th>
                <th>Note * Coefficient</th>
                <th>Opération</th>
            </tr>
        </table>
        <br>
        <br>
            <pre>
                <input type="hidden" id="SomCoef" readonly>

                <input type="hidden" id="SomNote" readonly>
           
                Moyenne Générale       :   <input type="text" id="moy" readonly>
                
                
            </pre>
           
        </table>
    </div>

</body>

</html>
